syntax = "proto3";

package mkit.service.emailer.v1;

option go_package = "github.com/ygpark2/njro/service/emailer/proto/emailer";
option java_multiple_files = true;
option java_package = "mkit.service.emailer.v1";

service EmailerService {
    rpc SendEmail (SendEmailRequest) returns (SendEmailResponse);
}

message SendEmailRequest {
    string to = 1;
    string from = 2;
    string subject = 3;
    string body = 4;
}

message SendEmailResponse {
    bool success = 1;
    string message = 2;
}

message Message {
    string to = 1;
    string from = 2;
    string subject = 3;
    string body = 4;
}
